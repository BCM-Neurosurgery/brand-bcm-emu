      sync_source_id: nsp_idx_2
      neural_ch_range: [128, 256]
      n_channels: 128
      ch_mask_stream: z_mask_stream

  # ---------------------------------------------------------------------
  # Hub 1 -- threshold extraction (three nodes, [0,96] / [96,192] / [192,256])
  # ---------------------------------------------------------------------
  - name: thresholdExtraction
    nickname: thresh_h1_1
    machine: brand
    module: ../brand-modules/brand-nsp
    run_priority: 99
    cpu_affinity: *cpu_thresh_hub1_1
    redis_outputs:
      thresh_h1_1: thresh_cross
    parameters:
      log: INFO
      pack_per_call: 1
      thresh_mult: -3.5
      thresh_calc_len: 2000
      butter_lowercut: 250
      butter_uppercut: ~
      butter_order: 4
      enable_CAR: False
      output_filtered: False
      acausal_filter_lag: 120
      acausal_filter: IIR
      input_name: reref_neural_hub1
      input_chan_per_stream: *nsp_channels
      input_samp_per_stream: *samp_per_stream
      input_samp_freq: *samp_freq
      input_data_type: float32
      use_tracking_id: True
      timestamp_data_type: uint64
      sync_key: sync
      time_key: ts
      sync_source_id: nsp_idx_1
      thresholds_stream: thresholds_hub1
      neural_ch_range: [0, 96]
      thresholds_ch_range: [0, 96]
      n_channels: 96
      ch_mask_stream: z_mask_stream

  - name: thresholdExtraction
    nickname: thresh_h1_2
    machine: brand
    module: ../brand-modules/brand-nsp
    run_priority: 99
    cpu_affinity: *cpu_thresh_hub1_2
    redis_outputs:
      thresh_h1_2: thresh_cross
    parameters:
      log: INFO
      pack_per_call: 1
      thresh_mult: -3.5
      thresh_calc_len: 2000
      butter_lowercut: 250
      butter_uppercut: ~
      butter_order: 4
      enable_CAR: False
      output_filtered: False
      acausal_filter_lag: 120
      acausal_filter: IIR
      input_name: reref_neural_hub1
      input_chan_per_stream: *nsp_channels
      input_samp_per_stream: *samp_per_stream
      input_samp_freq: *samp_freq
      input_data_type: float32
      use_tracking_id: True
