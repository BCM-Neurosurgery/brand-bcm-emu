      stream_names: [continuousAnalog]
      samp_freq: [*samp_freq]
      packet_type: [5]
      chan_per_stream: [*n_analog_channels] # 3 real analog inputs + 1 Blackrock zero-padded channel
      samp_per_stream: [*samp_per_stream]

  # ---------------------------------------------------------------------
  # centrals_interface -- starts/stops Central's recording, transcribed
  # as-given from Stanford's own graph config. module:
  # ../brand-modules/brand-stanford does not resolve in this repo
  # (brand-stanford isn't checked out here), same as the three
  # cerebusAdapter nodes above -- expected, this graph targets Stanford's
  # rig only. Stanford runs their own fork of this node: it takes
  # is_start/stop_recording_requested + recording_save_path directly, which
  # does NOT match brand-nsp/nodes/centrals_interface/centrals_interface.py
  # (env_file_path + block_metadata instead; that file's README still
  # documents the params used here). cpu_affinity 22 is Stanford's real
  # value, kept in stanford_cpu_affinity above. mediaPlayerTask stops the
  # recording at block end via updateParameters on this nickname.
  #
  # recording_save_path is Stanford's value as given -- confirm the actual
  # PC1 save path for this graph/block before relying on it.
  # ---------------------------------------------------------------------
  - name: centrals_interface
    nickname: centrals_interface
    machine: brand
    module: ../brand-modules/brand-stanford # does not resolve locally -- Stanford-only, see comment above
    cpu_affinity: *cpu_centrals_interface
    parameters:
      log: INFO
      is_start_recording_requested: true
      is_stop_recording_requested: false
      recording_save_path: 'E:/Session/Data/_NSP1' # TODO: confirm actual PC1 save path for this graph/block

  # ---------------------------------------------------------------------
  # Re-referencing, one node per hub. Both nodes share one global 512x512
  # coefficient matrix (chan_total: 512) and each slices out its own
  # contiguous 256-channel diagonal block via start_channel -- this is the
  # mechanism re_reference.py's initialize_coefficients() already supports
  # (see CLAUDE.md context / task notes). NOTE: the rereference_parameters
  # stream itself is NOT produced anywhere in this graph (out of scope for
  # this session -- blocked on t12's electrode mapping JSON), so both nodes
  # currently run on the fallback "subtract mean of own hub" path.
  #
  # Input streams (continuousNeural_hub_1 / continuousNeural_hub_2) match
  # the cerebusAdapter_hub_1 / cerebusAdapter_hub_2 nodes' redis_outputs above
  # exactly.
  # ---------------------------------------------------------------------
  - name: re_reference
    nickname: re_ref_hub1
    machine: brand
    module: ../brand-modules/brand-nsp
    run_priority: 99
    cpu_affinity: *cpu_re_ref_hub1
    redis_outputs:
      # reref_neural_hub1: rerefContinuousNeural
    parameters:
      log: INFO
      input_stream_name: continuousNeural_hub_1
      output_stream_name: reref_neural_hub1
      coefs_stream_name: rereference_parameters
      chan_per_stream: *nsp_channels
      samp_per_stream: *samp_per_stream
      chan_total: 512
      start_channel: 0
      output_dtype: float32

  - name: re_reference
    nickname: re_ref_hub2
    machine: brand
    module: ../brand-modules/brand-nsp
    run_priority: 99
    cpu_affinity: *cpu_re_ref_hub2
    redis_outputs:
      # reref_neural_hub2: rerefContinuousNeural
    parameters:
      log: INFO
      input_stream_name: continuousNeural_hub_2
      output_stream_name: reref_neural_hub2
      coefs_stream_name: rereference_parameters
      chan_per_stream: *nsp_channels
      samp_per_stream: *samp_per_stream
      chan_total: 512
      start_channel: 256
      output_dtype: float32

derivatives:

  # Unchanged from mediaPlayerTask.yaml -- porting this (output shape,
  # neural_n_channels/analog_n_channels for two hubs, etc.) is a later task.
  - rdb_to_mat_bcm:
      name: rdb_to_mat_bcm.py
      module: ../brand-modules/brand-bcm-emu
      autorun_step: 0
      parameters:
        include_continuous_neural: False
        include_channel_map: False
        include_analog: True
        analog_stream: nsp_analog # TODO: points to nothing in this graph -- analog layer not yet ported.
        neural_n_channels: 256
        analog_n_channels: 4  # matches n_analog_channels at the top of this file, NOT the 16 from mediaPlayerTask.yaml's single-NSP analog-input bank -- Stanford's cerebusAdapter_mic has a different channel count
        samp_per_stream: 30
