      thresholds_ch_range: [192, 256]
      n_channels: 64
      ch_mask_stream: z_mask_stream

  # ---------------------------------------------------------------------
  # Acquisition (L1) -- Stanford's three cerebusAdapter instances, transcribed
  # as-given from their own graph config. module: ../brand-modules/brand-stanford
  # does not resolve in this repo (brand-stanford isn't checked out here) --
  # that's expected, this graph targets Stanford's rig only and won't load/run
  # locally. machine: brand matches the rest of the acquisition/feature-
  # extraction chain below, per Stanford's brand/puget machine split.
  #
  # broadcast_ip / broadcast_device are NOT included below -- Stanford's
  # message to us only specified broadcast_port (+ the stream-shape params),
  # not the NIC/IP side of the socket config, and those aren't ours to guess
  # (see CLAUDE.md's CerebusAdapter networking notes on broadcast_ip binding
  # to the subnet broadcast address and broadcast_device picking the NIC).
  # Fill these in from Stanford's actual config before this graph can load.
  # ---------------------------------------------------------------------
  - name: cerebusAdapter
    nickname: cerebusAdapter_hub_1
    machine: brand
    module: ../brand-modules/brand-stanford # does not resolve locally -- Stanford-only, see comment above
