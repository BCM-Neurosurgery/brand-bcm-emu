      sync_source_id: nsp_idx_1
      neural_ch_range: [128, 256]
      n_channels: 128
      ch_mask_stream: z_mask_stream

  # ---------------------------------------------------------------------
  # Hub 2 -- bandpower extraction (two nodes, [0,128] / [128,256] within hub)
  # ---------------------------------------------------------------------
  - name: bpExtraction
    nickname: sbp_h2_1
    machine: brand
    module: ../brand-modules/brand-nsp
