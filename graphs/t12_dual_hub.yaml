      butter_uppercut: ~
      butter_order: 4
      enable_CAR: False
      output_filtered: False
      acausal_filter_lag: 120
      acausal_filter: IIR
      input_name: reref_neural_hub1
      input_chan_per_stream: *nsp_channels
      input_samp_per_stream: *samp_per_stream
