      continuousNeural_hub_1: ContinuousNeural
    parameters:
      # broadcast_ip: # TODO: Stanford's subnet broadcast address for hub 1, not given
      broadcast_port: 51002
      # broadcast_device: # TODO: Stanford's NIC for hub 1, not given
      num_streams: 1
      stream_names: [continuousNeural_hub_1]
      samp_freq: [*samp_freq]
      packet_type: [5]
      chan_per_stream: [*nsp_channels]
      samp_per_stream: [*samp_per_stream]

