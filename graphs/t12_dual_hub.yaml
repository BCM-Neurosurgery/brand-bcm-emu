
# graph parameters
parameters:
  nsp_channels: &nsp_channels 256          # channels per hub (both hub_1 and hub_2)
  total_features: &total_features 1024
  n_analog_channels: &n_analog_channels 4  # cerebusAdapter_mic: 3 real inputs + 1 Blackrock zero-padded channel -- do not "fix" to 3
  samp_freq: &samp_freq 30000              # NSP sample rate, Hz
  samp_per_stream: &samp_per_stream 30     # samples per channel per redis entry, at samp_freq

# ---------------------------------------------------------------------
# CPU affinity anchors.
#
# History: the hub-1 values here originally came from our BCM-emu rig
# (mediaPlayerTask.yaml). The hub-2 values (24-34) were NEW, invented when
# hub 2 was added, and never validated -- mediaPlayerTask.yaml only uses
# cores 2-23, so they were not copied from anywhere. Stanford's brand-pc
# has no cores above 23, so those six hub-2 nodes would have failed to
# launch.
#
# Stanford's brand-pc topology (0-23):
#   0-15   performance cores, as dual-thread (hyperthread) pairs
#   16-23  efficiency cores, single-thread
# Reserved: 2-7 for Stanford's three cerebusAdapters, 22 for
# centrals_interface (both in stanford_cpu_affinity below).
#
# Budget in 8-23: 4 P-core pairs (8-9, 10-11, 12-13, 14-15) + 8 E-cores
# (16-23) = 12 slots. Brand-machine nodes in this block: 2 re_reference +
# 6 thresholdExtraction + 4 bpExtraction + bin_multiple = 13, plus
# centrals_interface already on 22 = 14 occupants for 12 slots. It does
# NOT fit one-per-slot; two slots are doubled:
#   - 22: bin_multiple shares with centrals_interface. centrals_interface
#     is idle between recording start/stop, and bin_multiple is the
#     lightest node here (bins every 10 ms, no filtering).
#   - 14-15: thresh_hub1_3 and thresh_hub2_3 share one P-core pair. They
#     are the two smallest threshold nodes (64 ch each), and a pair has
#     two hardware threads, so each gets a hyperthread rather than
#     time-sharing one single-thread E-core.
# Filtering-heavy nodes get P-cores first. thresholdExtraction is ranked
# above bpExtraction because it also runs the acausal IIR (lag 120) where
# bpExtraction is causal-only -- judged from the config, NOT measured.
# Since there are 5 P-core thresh slots for 6 thresh nodes, thresh_hub2_2
# lands on an E-core while its hub-1 counterpart is on a P pair.
#
# OPEN QUESTION FOR STANFORD: E-cores are single-thread, and we have not
# measured whether any of these nodes (including re_reference's 256x256
# matmul per 1 ms entry) holds 1000 Hz on one. Don't resolve this by
# guessing -- confirm on their machine before relying on this layout.
#
# screen_recorder / media_player_task run on machine: puget, not brand, so
# they are outside this budget; their values are still our rig's and are
# unvalidated for Stanford's puget.
# ---------------------------------------------------------------------
cpu_affinity_anchors:
  screen_recorder:    &cpu_screen_recorder    20     # puget -- our rig's value, unvalidated
  media_player_task:  &cpu_media_player_task  18     # puget -- our rig's value, unvalidated
  thresh_hub1_1:      &cpu_thresh_hub1_1      8-9    # P pair
  thresh_hub1_2:      &cpu_thresh_hub1_2      10-11  # P pair
  thresh_hub2_1:      &cpu_thresh_hub2_1      12-13  # P pair
  thresh_hub1_3:      &cpu_thresh_hub1_3      14-15  # P pair, DOUBLED with thresh_hub2_3
  thresh_hub2_3:      &cpu_thresh_hub2_3      14-15  # P pair, DOUBLED with thresh_hub1_3
  thresh_hub2_2:      &cpu_thresh_hub2_2      16     # E-core
  bp_hub1_1:          &cpu_bp_hub1_1          17     # E-core
  bp_hub1_2:          &cpu_bp_hub1_2          18     # E-core
  bp_hub2_1:          &cpu_bp_hub2_1          19     # E-core
  bp_hub2_2:          &cpu_bp_hub2_2          20     # E-core
  re_ref_hub1:        &cpu_re_ref_hub1        21     # E-core
  bin_multiple:       &cpu_bin_multiple       22     # E-core, DOUBLED with centrals_interface
  re_ref_hub2:        &cpu_re_ref_hub2        23     # E-core

# ---------------------------------------------------------------------
# Stanford's ACTUAL cpu_affinity assignments for their "brand" machine's
# three cerebusAdapter instances and centrals_interface (from their own
# graph config, given as-is -- not derived, not ours to guess). These are
# real values, NOT
# placeholders -- keep them out of cpu_affinity_anchors above so a future
# pass that replaces those placeholders with real BCM-emu-equivalent values
# doesn't also overwrite these.
# ---------------------------------------------------------------------
stanford_cpu_affinity:
  cerebusAdapter_hub_1: &cpu_cerebusAdapter_hub_1 4-5
  cerebusAdapter_hub_2: &cpu_cerebusAdapter_hub_2 6-7
  cerebusAdapter_mic:   &cpu_cerebusAdapter_mic   2-3
  centrals_interface:   &cpu_centrals_interface   22

# metadata for supergraph
metadata:
  participant_id:            t12
  graph_name:                dual hub (Stanford port)
  description:               mediaPlayerTask ported to a two-hub (two independent 256-channel NSP) rig; raw neural streams stay per-hub, merge happens at the binned-feature layer
  participant_file:          ../Data/t12/t12.yaml #! to revise

# node-specific parameters
nodes:

  # ---------------------------------------------------------------------
  # Screen recorder, mediaPlayerTask. screen_recorder is unchanged from
  # mediaPlayerTask.yaml (porting it to the Stanford rig is a later task).
  # mediaPlayerTask is the same except for its NSP parameters, which are
  # set for this rig (see the comments on them below).
  # ---------------------------------------------------------------------
  - name:     screen_recorder
    nickname: screen_recorder
    machine:  puget
    module:   ../brand-modules/brand-bcm-emu
    run_priority: 99
    cpu_affinity: *cpu_screen_recorder
    parameters:
      log: INFO
      format: mkv
      crf: 23
      record_audio: False
      # screen_id: 0  # uncomment + set to crop to one monitor (see xrandr --listmonitors)

  - name:     mediaPlayerTask
    nickname: mediaPlayerTask
    machine:  puget
    module:   ../brand-modules/brand-bcm-emu
    run_priority:   99
    cpu_affinity:   *cpu_media_player_task # TODO: change this when running
    redis_outputs:
      task_state: task_state
      trial_info: trial_info
    parameters:
      log: INFO
      media_folder_path: ../brand-modules/brand-bcm-emu/assets/media_player
      media_number: '01'  # selects the file whose name starts with '01_'
      player_cmd: mpv
      progress_update_interval_s: 1.0
      task_state_output_stream: task_state
      trial_info_output_stream: trial_info
      # True so the Central recording that centrals_interface starts gets
      # stopped at block end (updateParameters is_stop_recording_requested).
      control_nsp_recording: True
      # NSP timestamps embedded in task_state/trial_info, for checking later
      # whether the two hubs share a clock (compare the hub 1 and hub 2
      # values in the same entry).
      include_nsp_neural_timestamp: True
      nsp_neural_stream: continuousNeural_hub_1
      include_nsp_neural_timestamp_hub_2: True
      nsp_neural_stream_hub_2: continuousNeural_hub_2
      include_nsp_analog_timestamp: True
      nsp_analog_stream: continuousAnalog
      auto_stop_graph: True
      auto_stop_do_save: True
      auto_stop_do_derivatives: True
      sync_key: sync
      time_key: ts

  # ---------------------------------------------------------------------
  # bin_multiple -- merges both hubs' feature streams into one output.
  #
  # input_streams is grouped BY FEATURE TYPE (all thresholds, then all
  # band power), not by hub, so the resulting binnedFeatures layout stays
  # isomorphic to the existing single-256-channel graph's layout
  # (thresholds first, then band power). Output channel ranges, in order
  # (bin_multiple assigns ranges by accumulating chan_per_stream in the
  # order input_streams are listed -- this ordering is a design decision
  # downstream analysis code will depend on, not an implementation detail):
  #
  #   stream            hub   feature type          chan_per_stream   output channel range
  #   ----------------  ----  --------------------  ----------------  --------------------
  #   thresh_h1_1       1     threshold crossings    96                [   0,  96)
  #   thresh_h1_2       1     threshold crossings    96                [  96, 192)
  #   thresh_h1_3       1     threshold crossings    64                [ 192, 256)
  #   thresh_h2_1       2     threshold crossings    96                [ 256, 352)
  #   thresh_h2_2       2     threshold crossings    96                [ 352, 448)
  #   thresh_h2_3       2     threshold crossings    64                [ 448, 512)
  #   sbp_h1_1          1     spike band power       128               [ 512, 640)
  #   sbp_h1_2          1     spike band power       128               [ 640, 768)
  #   sbp_h2_1          2     spike band power       128               [ 768, 896)
  #   sbp_h2_2          2     spike band power       128               [ 896, 1024)
  # ---------------------------------------------------------------------
  - name: bin_multiple
    nickname: bin_multiple
    machine: brand
    module: ../brand-modules/brand-rice
    run_priority: 99
    cpu_affinity: *cpu_bin_multiple
    redis_outputs:
      binned_spikes: binned_spikes
    parameters:
      chan_per_stream: [96, 96, 64, 96, 96, 64, 128, 128, 128, 128]
      total_channels: *total_features
      bin_size: 10
      log: INFO
      input_streams: [thresh_h1_1, thresh_h1_2, thresh_h1_3, thresh_h2_1, thresh_h2_2, thresh_h2_3, sbp_h1_1, sbp_h1_2, sbp_h2_1, sbp_h2_2]
      input_field: [crossings, crossings, crossings, crossings, crossings, crossings, samples, samples, samples, samples]
      input_dtype: [int16, int16, int16, int16, int16, int16, float32, float32, float32, float32]
      output_stream: binned_spikes
      output_dtype: float32

  # ---------------------------------------------------------------------
  # Hub 1 -- bandpower extraction (two nodes, [0,128] / [128,256] within hub)
  # ---------------------------------------------------------------------
  - name: bpExtraction
    nickname: sbp_h1_1
    machine: brand
    module: ../brand-modules/brand-nsp
    run_priority: 99
    cpu_affinity: *cpu_bp_hub1_1
    redis_outputs:
      sbp_h1_1: band_power
    parameters:
      log: INFO
      pack_per_call: 1
      butter_lowercut: 250
      butter_uppercut: ~
      butter_order: 4
      enable_CAR: True
      CAR_group_sizes: 64
      acausal_filter_lag: 120
      acausal_filter: ~
      input_name: reref_neural_hub1
      input_chan_per_stream: *nsp_channels
      input_samp_per_stream: *samp_per_stream
      input_samp_freq: *samp_freq
      input_data_type: float32
      use_tracking_id: True
      timestamp_data_type: uint64
      sync_key: sync
      time_key: ts
      sync_source_id: nsp_idx_1
      neural_ch_range: [0, 128]
      n_channels: 128
      ch_mask_stream: z_mask_stream

  - name: bpExtraction
    nickname: sbp_h1_2
    machine: brand
    module: ../brand-modules/brand-nsp
    run_priority: 99
    cpu_affinity: *cpu_bp_hub1_2
    redis_outputs:
