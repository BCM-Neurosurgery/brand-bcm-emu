  # reformatting shim reshaping spike_gen_30k's output into exactly what
  # re_reference expects from a real cerebusAdapterBCM ('samples' +
  # 'timestamps' fields, channel-major (chan_per_stream, samp_per_stream)
  # int16 + uint64) -- see nsp_neural_sim.py's docstring for why the
  # reshape/transpose is needed. Throwaway/testing-only: swap back to the
  # real nsp1_in node above once real NSP hardware is available.
  # ---------------------------------------------------------------------
  # DISABLED -- swapped out for the real nsp1_in (cerebusAdapterBCM) node
  # above now that we're testing against real NSP1 hardware instead of
  # simulated data. Re-enable (and comment out nsp1_in again) if we need to
  # go back to sim-only testing.
  # - name: mouseAdapter
  #   nickname: mouseAdapterSim
  #   module: ../brand-modules/brand-simulator
