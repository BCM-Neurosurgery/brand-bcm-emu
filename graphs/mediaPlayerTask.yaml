  #     maxlen: 2000


derivatives:

  # Runs automatically on graph stop (mediaPlayerTask's auto_stop_do_derivatives:
  # True triggers every derivative here), or manually via the supervisor's
  # 'make' command. See rdb_to_mat_bcm.py's module docstring for exactly what
  # gets written -- one .mat per stream, no per-trial slicing (this graph only
  # has one continuous playback "trial", not many discrete ones).
  - rdb_to_mat_bcm:
      name: rdb_to_mat_bcm.py
      module: ../brand-modules/brand-bcm-emu
      autorun_step: 0
      parameters:
        include_continuous_neural: False  # raw 30kHz nsp_neural -- large, opt-in
        include_channel_map: False        # opt-in, see cerebusAdapterBCM's channel_map stream
        include_analog: True              # save nsp_analog (analog-input bank) alongside neural
        analog_stream: nsp_analog         # must match nsp1_in's analog_stream_name above
        # Reshape params for reref_neural/nsp_neural/nsp_analog's flattened
        # channel-major 'samples' buffers back to (N, n_channels,
        # samp_per_stream) -- keep in sync with nsp1_in's n_neural_channels
        # (256) and samples_per_entry (30), and re_ref's samp_per_stream (30).
        neural_n_channels: 256
        analog_n_channels: 16
        samp_per_stream: 30

