participant_id: bcm_emu
graph_name: dual_nsp_audio
session_description: >
  Stream continuous data (neural + behavioral/analog-input) from both NSPs,
  via cerebusAdapterBCM (pycbsdk-based, auto-discovering) instead of the
  legacy raw-UDP cerebusAdapter node -- see nodes/cerebusAdapterBCM/README.md
  for why. No packet_type/chan_per_stream/samp_freq need to be hand-specified
  here; the node queries the live NSP for its active Sample Groups and
  channel layout on connect, and records exactly what it found in each
  node's "<redis_output_prefix>_channel_map" stream.

  Verified end-to-end, both nodes running concurrently through a real
  supervisor process, against this rig's live NSP emulator (see the node's
  README for full numbers): NSP1 produces two streams (nsp1_in_g3: neural,
  2kHz; nsp1_in_g5: analog-input/behavioral bank incl. PS4_audio, 30kHz)
  since neural and analog-input are on different Sample Groups there. NSP2
  produces one combined stream (nsp2_in_g5: neural + analog-input
  together, 30kHz, 94 channels) since both are on the same Sample Group on
  that NSP -- columns 0-79 are neural, 80-93 are the analog-input bank,
  per that node's channel_map (this ordering came from cbsdk's
  get_group_channels(), not a guess). Both NSPs' PS4_audio channels
  cross-correlate at 0.9998 -- confirmed genuinely capturing the same real
  audio, not silence/noise.

  `shmem_instance` (0/1 below, distinct per node) is required for this to
  work correctly with both NSPs connected at once -- without it, the
  second-opened session silently mirrors the first's data instead of
  connecting to its own device (root-caused and fixed upstream in
  pycbsdk; see CLAUDE.md).

nodes:
  # ---------------------------------------------------------------------
  # NSP1 -- enp4s0
  # ---------------------------------------------------------------------
  - name: cerebusAdapterBCM
    nickname: nsp1_in
    module: ../brand-modules/brand-bcm-emu
    run_priority: 99
    cpu_affinity: 2
    parameters:
      log: INFO
      device_address: 192.168.137.128
      client_interface: enp4s0
      shmem_instance: 0
      redis_output_prefix: nsp1_in
      connect_timeout_s: 10

  # ---------------------------------------------------------------------
  # NSP2 -- enp5s0f3
  # ---------------------------------------------------------------------
  - name: cerebusAdapterBCM
    nickname: nsp2_in
    module: ../brand-modules/brand-bcm-emu
    run_priority: 99
    cpu_affinity: 3
    parameters:
      log: INFO
      device_address: 192.168.137.128
      client_interface: enp5s0f3
      shmem_instance: 1
      redis_output_prefix: nsp2_in
      connect_timeout_s: 10
